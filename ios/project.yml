name: Couchpotato
options:
  bundleIdPrefix: de.koeven
  developmentLanguage: de
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

packages:
  # VLC for MKV, AVI & co. (official VideoLAN package, pinned)
  VLCKit:
    url: https://github.com/videolan/vlckit
    revision: 3d0f0fa7031eab1a67c817c98a495e1c68fc998c

targets:
  Couchpotato:
    type: application
    platform: iOS
    sources:
      - path: Couchpotato
    dependencies:
      - package: VLCKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.koeven.couchpotato
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # public values of the household sync (same as in the TV app); the CI sets them from the repo secrets
        CP_SUPABASE_URL: ""
        CP_SUPABASE_KEY: ""
    info:
      path: Couchpotato/Info.plist
      properties:
        CFBundleDisplayName: Couchpotato
        CFBundleDevelopmentRegion: de
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # only standard encryption (HTTPS, AES-GCM of the household data) – exempt from export documentation
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIUserInterfaceStyle: Dark
        UIAppFonts: [baloo2_700.ttf, baloo2_800.ttf]
        # picture in picture and AirPlay keep playing when the app is in the background
        UIBackgroundModes: [audio]
        # IPTV servers mostly speak plain http – the user enters them, the app can't know them beforehand.
        # Only this one key: with NSAllowsArbitraryLoadsForMedia (or …InWebContent / NSAllowsLocalNetworking)
        # next to it, iOS ignores NSAllowsArbitraryLoads and blocks every http request.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        # finding the household's Couchpotato TVs in the Wi-Fi
        NSLocalNetworkUsageDescription: "Couchpotato findet damit deine Couchpotato-Fernseher im WLAN – für den Katalog, „Auf Fernseher abspielen“ und die Fernbedienung."
        NSBonjourServices: [_couchpotato._tcp]
        CPSupabaseURL: $(CP_SUPABASE_URL)
        CPSupabaseKey: $(CP_SUPABASE_KEY)

  CouchpotatoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CouchpotatoTests
    dependencies:
      - target: Couchpotato
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.koeven.couchpotato.tests
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Couchpotato.app/Couchpotato"

schemes:
  Couchpotato:
    build:
      targets:
        Couchpotato: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CouchpotatoTests
