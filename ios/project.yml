name: Couchpotato
options:
  bundleIdPrefix: de.koeven
  developmentLanguage: de
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  Couchpotato:
    type: application
    platform: iOS
    sources:
      - path: Couchpotato
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.koeven.couchpotato
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # public values of the household sync (same as in the TV app); the CI sets them from the repo secrets
        CP_SUPABASE_URL: ""
        CP_SUPABASE_KEY: ""
    info:
      path: Couchpotato/Info.plist
      properties:
        CFBundleDisplayName: Couchpotato
        CFBundleDevelopmentRegion: de
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # only standard encryption (HTTPS, AES-GCM of the household data) – exempt from export documentation
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIUserInterfaceStyle: Dark
        UIAppFonts: [baloo2_700.ttf, baloo2_800.ttf]
        # picture in picture and AirPlay keep playing when the app is in the background
        UIBackgroundModes: [audio]
        # IPTV servers mostly speak plain http – the user enters them, the app can't know them beforehand
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsArbitraryLoadsForMedia: true
        CPSupabaseURL: $(CP_SUPABASE_URL)
        CPSupabaseKey: $(CP_SUPABASE_KEY)

  CouchpotatoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CouchpotatoTests
    dependencies:
      - target: Couchpotato
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.koeven.couchpotato.tests
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Couchpotato.app/Couchpotato"

schemes:
  Couchpotato:
    build:
      targets:
        Couchpotato: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CouchpotatoTests
