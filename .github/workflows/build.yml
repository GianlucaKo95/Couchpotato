name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Same signing key for every build, so updates install over the old version.
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.CP_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/couchpotato.jks"
            echo "CP_KEYSTORE=$RUNNER_TEMP/couchpotato.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::CP_KEYSTORE_B64 not set – building with a throwaway debug key"
          fi

      - name: Build
        env:
          CP_KEYSTORE_PASSWORD: ${{ secrets.CP_KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon 2>&1 | tee build.log

      # Compiler errors as annotations, so they can be read without downloading the log
      - name: Report compile errors
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong" -A2 build.log | head -40 | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk couchpotato.apk

      - uses: actions/upload-artifact@v4
        with:
          name: couchpotato
          path: couchpotato.apk

      - name: Publish as release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Couchpotato ${{ github.run_number }}
          files: couchpotato.apk
          make_latest: true
