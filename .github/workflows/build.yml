name: Build APK

on:
  push:
    branches: [main]
    # the iPhone app has its own workflow (ios.yml) – no new TV release for it
    paths-ignore: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      # Same signing key for every build, so updates install over the old version.
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.CP_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/couchpotato.jks"
            echo "CP_KEYSTORE=$RUNNER_TEMP/couchpotato.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::CP_KEYSTORE_B64 not set – building with a throwaway debug key"
          fi

      - name: Build
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
          UPDATE_TOKEN: ${{ secrets.UPDATE_TOKEN }}
          CP_KEYSTORE_PASSWORD: ${{ secrets.CP_KEYSTORE_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -o pipefail
          if [ -z "$UPDATE_TOKEN" ]; then echo "::warning::UPDATE_TOKEN secret not set - in-app updates off"; else echo "::notice::Update token present"; fi
          if [ -z "$TMDB_TOKEN" ]; then echo "::warning::TMDB_TOKEN secret not set - TMDB details off"; else echo "::notice::TMDB token present"; fi
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then echo "::warning::SUPABASE secrets not set - device sync off"; else echo "::notice::Supabase sync configured"; fi
          ./gradlew testReleaseUnitTest assembleRelease --no-daemon 2>&1 | tee build.log

      # Compiler errors as annotations, so they can be read without downloading the log
      - name: Report compile errors
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong| FAILED$|Error:|expected:" -A2 build.log | head -40 | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk couchpotato.apk
          # R8 renames classes; this file translates crash reports back
          cp app/build/outputs/mapping/release/mapping.txt couchpotato-mapping.txt

      - uses: actions/upload-artifact@v7
        with:
          name: couchpotato
          path: couchpotato.apk

      - name: Publish as release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: build-${{ github.run_number }}
          name: Couchpotato ${{ github.run_number }}
          files: |
            couchpotato.apk
            couchpotato-mapping.txt
          make_latest: true
